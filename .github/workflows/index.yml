# Mỗi lần có thay đổi: dựng data/index.json rồi commit lại.
# Web đã chuyển sang Cloudflare Workers (cf/) — Worker đọc index.json qua GitHub API, không còn deploy Pages.
name: index
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: index
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dựng index
        run: python tools/kho.py index
      - name: Commit index nếu đổi
        run: |
          git config user.name "kho-bot"
          git config user.email "kho-bot@users.noreply.github.com"
          git add data/index.json
          if ! git diff --cached --quiet; then
            git commit -m "index" -q
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done
          fi
